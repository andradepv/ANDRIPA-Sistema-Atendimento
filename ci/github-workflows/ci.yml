name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Publicar em produção após homologação"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: atende, POSTGRES_PASSWORD: atende, POSTGRES_DB: atende_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U atende" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    defaults: { run: { working-directory: backend } }
    env:
      ANDRIPA_TEST_DATABASE_URL: postgresql+psycopg://atende:atende@127.0.0.1:5432/atende_test
      ANDRIPA_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Tipagem
        run: mypy app
      - name: Segurança do código (bandit)
        run: bandit -q -r app -c pyproject.toml
      - name: Vulnerabilidades em dependências
        run: pip-audit -r requirements.txt
      - name: Testes (unidade, integração, autorização, concorrência, tempo real)
        run: pytest -q --junitxml=test-results/junit.xml
      - name: Migração sem divergência com os modelos
        env: { ANDRIPA_DATABASE_URL: postgresql+psycopg://atende:atende@127.0.0.1:5432/atende_test }
        run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: backend/test-results }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # Gere e versione o package-lock.json (npm install) para trocar por `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: frontend/dist }

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: atende, POSTGRES_PASSWORD: atende, POSTGRES_DB: atende }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U atende" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      ANDRIPA_DATABASE_URL: postgresql+psycopg://atende:atende@127.0.0.1:5432/atende
      ANDRIPA_COOKIE_SECURE: "false"
      ANDRIPA_PUBLIC_BASE_URL: http://localhost:8000
      ANDRIPA_ALLOWED_ORIGINS: http://localhost:8000
      ANDRIPA_FRONTEND_DIST_DIR: ${{ github.workspace }}/frontend/dist
      ANDRIPA_DEV_PASSWORD: demo-senha-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: frontend/dist }
      - run: pip install -r backend/requirements.txt
      - working-directory: backend
        run: |
          alembic upgrade head
          python -m app.cli seed-dev
          nohup uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8000/api/v1/health/ready && break; sleep 1; done
      - working-directory: frontend
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium && npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-results, path: "frontend/test-results\napi.log" }

  image:
    if: github.ref == 'refs/heads/main'
    needs: [e2e]
    runs-on: ubuntu-latest
    permissions: { id-token: write, contents: read }
    environment: staging
    outputs:
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: "${{ vars.AWS_DEPLOY_ROLE_ARN }}", aws-region: sa-east-1 }
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
          provenance: true
          sbom: true

  deploy-staging:
    needs: [image]
    uses: ./.github/workflows/deploy.yml
    with: { environment: staging, image_tag: "${{ github.sha }}" }
    secrets: inherit

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    needs: [deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with: { environment: production, image_tag: "${{ github.sha }}" }
    secrets: inherit
